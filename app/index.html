<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MultiTracker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <h1><a class="back" href="/" data-i18n-title="panel.back" data-i18n-aria="panel.back">←</a>MultiTracker</h1>
  <div class="actions">
    <label class="lang"><span data-i18n="panel.language"></span> <select id="language"></select></label>
    <button id="about" data-i18n="panel.about"></button>
    <button id="copyLink" data-i18n="panel.copyLink"></button>
    <button id="openWindow" class="primary" data-i18n="panel.openWindow"></button>
  </div>
</header>
<main>
  <form id="form">
    <section>
      <h2 data-i18n="save.title"></h2>
      <select id="saveId" data-i18n-aria="save.aria"></select>
      <div id="customSave" class="path-row" hidden>
        <input id="saveFile" data-i18n-aria="save.pathAria" data-i18n-placeholder="save.pathPlaceholder" spellcheck="false">
        <button type="button" id="browseSave" data-i18n="save.browse"></button>
      </div>
      <p class="note" id="saveStatus"></p>
    </section>
    <section>
      <h2 data-i18n="run.title"></h2>
      <div id="showRun" class="checks"></div>
      <p class="note" id="logStatus"></p>
    </section>
    <section>
      <h2 data-i18n="progress.title"></h2>
      <div id="showProgress" class="checks"></div>
      <div class="fields spaced">
        <label><span data-i18n="progress.style"></span>
          <select data-option="progressStyle"><option value="icons" data-i18n="progress.icons"></option><option value="text" data-i18n="progress.text"></option></select>
        </label>
        <label><span data-i18n="progress.pending"></span>
          <select data-option="pendingLook"><option value="color" data-i18n="progress.pendingColor"></option><option value="gray" data-i18n="progress.pendingGray"></option></select>
        </label>
      </div>
      <p class="note" data-i18n="progress.iconsNote"></p>
    </section>
    <section>
      <h2 data-i18n="goals.title"></h2>
      <div id="goals" class="checks"></div>
    </section>
    <section>
      <h2 data-i18n="watched.title"></h2>
      <div id="watched" class="checks"></div>
    </section>
    <section>
      <h2 data-i18n="items.title"></h2>
      <div class="fields">
        <label><span data-i18n="items.max"></span> <input type="number" data-option="maxItems" min="0" max="200"></label>
        <label><span data-i18n="items.removed"></span>
          <select data-option="removed"><option value="dim" data-i18n="items.dim"></option><option value="hide" data-i18n="items.hide"></option></select>
        </label>
      </div>
      <div class="checks">
        <label><input type="checkbox" data-option="hideDone"> <span data-i18n="items.hideDone"></span></label>
        <label><input type="checkbox" data-option="floorGroups"> <span data-i18n="items.floorGroups"></span></label>
        <label><input type="checkbox" data-option="transformsClose"> <span data-i18n="items.transformsClose"></span></label>
      </div>
    </section>
    <section>
      <h2 data-i18n="highlight.title"></h2>
      <div class="checks"><label><input type="checkbox" data-option="highlight"> <span data-i18n="highlight.on"></span></label></div>
      <div class="fields">
        <label><span data-i18n="highlight.seconds"></span> <span class="slider"><input type="range" data-option="highlightSeconds" min="2" max="20"><output></output></span></label>
      </div>
      <button type="button" id="testHighlight" data-i18n="highlight.test"></button>
    </section>
    <section>
      <h2 data-i18n="look.title"></h2>
      <div class="fields">
        <label><span data-i18n="look.theme"></span>
          <select id="theme" data-i18n-aria="look.themeAria"></select>
        </label>
      </div>
      <h3 data-i18n="look.text"></h3>
      <div class="fields">
        <label><span data-i18n="look.font"></span> <input data-option="font" list="fonts" maxlength="40" spellcheck="false"></label>
        <datalist id="fonts">
          <option value="Upheaval"><option value="Segoe UI"><option value="Arial"><option value="Bahnschrift"><option value="Consolas"><option value="Georgia"><option value="Impact"><option value="Trebuchet MS"><option value="Verdana"><option value="Comic Sans MS">
        </datalist>
        <label><span data-i18n="look.fontSize"></span> <span class="slider"><input type="range" data-option="fontSize" min="10" max="32"><output></output></span></label>
        <label><span data-i18n="look.effect"></span>
          <select data-option="textEffect"><option value="none" data-i18n="look.none"></option><option value="shadow" data-i18n="look.shadow"></option><option value="outline" data-i18n="look.outline"></option></select>
        </label>
        <label><span data-i18n="look.textColor"></span> <input type="color" data-option="textColor"></label>
        <label><span data-i18n="look.accentColor"></span> <input type="color" data-option="accentColor"></label>
        <label><span data-i18n="look.doneColor"></span> <input type="color" data-option="doneColor"></label>
      </div>
      <div class="checks"><label><input type="checkbox" data-option="bold"> <span data-i18n="look.bold"></span></label></div>
      <h3 data-i18n="look.icons"></h3>
      <div class="fields">
        <label><span data-i18n="look.iconAuto"></span> <input type="checkbox" data-option="iconAuto"></label>
        <label><span data-i18n="look.iconSize"></span> <span class="slider"><input type="range" data-option="iconSize" min="16" max="96" step="4"><output></output></span></label>
        <label><span data-i18n="look.rows"></span> <span class="slider"><input type="range" data-option="rows" min="0" max="8"><output></output></span></label>
        <label><span data-i18n="look.iconGap"></span> <span class="slider"><input type="range" data-option="iconGap" min="0" max="16"><output></output></span></label>
        <label><span data-i18n="look.blindColor"></span> <input type="color" data-option="blindColor"></label>
        <label><span data-i18n="look.effect"></span>
          <select data-option="iconEffect"><option value="none" data-i18n="look.none"></option><option value="glow" data-i18n="look.glow"></option><option value="shadow" data-i18n="look.shadow"></option></select>
        </label>
      </div>
      <p class="note error" id="iconNote"></p>
      <h3 data-i18n="look.layout"></h3>
      <div class="fields">
        <label><span data-i18n="look.mode"></span>
          <select data-option="layout"><option value="banner" data-i18n="look.banner"></option><option value="wide" data-i18n="look.wide"></option></select>
        </label>
        <label><span data-i18n="look.align"></span>
          <select data-option="align"><option value="left" data-i18n="look.left"></option><option value="center" data-i18n="look.center"></option><option value="right" data-i18n="look.right"></option></select>
        </label>
        <label><span data-i18n="look.itemsPosition"></span>
          <select data-option="itemsPosition"><option value="below" data-i18n="look.itemsBelow"></option><option value="above" data-i18n="look.itemsAbove"></option></select>
        </label>
        <label><span data-i18n="look.rowGap"></span> <span class="slider"><input type="range" data-option="rowGap" min="0" max="24"><output></output></span></label>
        <label><span data-i18n="look.padding"></span> <span class="slider"><input type="range" data-option="padding" min="0" max="32"><output></output></span></label>
      </div>
      <h3 data-i18n="look.background"></h3>
      <div class="fields">
        <label><span data-i18n="look.bgType"></span>
          <select data-option="background"><option value="transparent" data-i18n="look.transparent"></option><option value="solid" data-i18n="look.solid"></option><option value="brick" data-i18n="look.brick"></option></select>
        </label>
        <label><span data-i18n="look.color"></span> <input type="color" data-option="color"></label>
        <label><span data-i18n="look.opacity"></span> <span class="slider"><input type="range" data-option="backgroundOpacity" min="0" max="100" step="5"><output></output></span></label>
        <label><span data-i18n="look.radius"></span> <span class="slider"><input type="range" data-option="radius" min="0" max="24"><output></output></span></label>
      </div>
    </section>
  </form>
  <section id="previewPane">
    <h2 data-i18n="preview.title"></h2>
    <iframe id="preview" src="overlay.html" data-i18n-title="preview.frame"></iframe>
    <div id="obsOption" class="checks single" hidden>
      <label><input type="checkbox" id="obsServer"> <span data-i18n="obs.server"></span></label>
    </div>
    <p class="note" id="obsNote" hidden data-i18n="obs.serverNote"></p>
    <p class="note" id="linkRow"><span data-i18n="preview.obsLink"></span> <code id="link"></code></p>
  </section>
</main>
<dialog id="aboutDialog" aria-labelledby="aboutTitle">
  <h2 id="aboutTitle" data-i18n="about.title"></h2>
  <p data-i18n="about.lead"></p>
  <h3 data-i18n="about.credits"></h3>
  <dl>
    <dt><a href="https://github.com/maflatv/MultiTracker" target="_blank" rel="noopener">MultiTracker</a></dt>
    <dd><strong>Mafla</strong>. <span data-i18n="about.creator"></span></dd>
    <dt><a href="https://github.com/Hyphen-ated/RebirthItemTracker" target="_blank" rel="noopener">Rebirth Item Tracker</a></dt>
    <dd><strong>Brett824 <span data-i18n="about.and"></span> Hyphen-ated</strong>. <span data-i18n="about.rit"></span></dd>
    <dt>Isaac Deadgod Tracker</dt>
    <dd><strong>veryhighlibido</strong>. <span data-i18n="about.deadgod"></span></dd>
    <dt><a href="https://www.dafont.com/aenigma.d188" target="_blank" rel="noopener" data-i18n="about.font"></a></dt>
    <dd><strong>Brian Kent (Ænigma Fonts)</strong>. <span data-i18n="about.fontNote"></span></dd>
    <dt><a href="https://www.electronjs.org" target="_blank" rel="noopener">Electron</a> (Chromium, Node.js)</dt>
    <dd><strong>OpenJS Foundation <span data-i18n="about.and"></span> <span data-i18n="about.contributors"></span></strong>. <span data-i18n="about.electron"></span></dd>
    <dt>The Binding of Isaac: Repentance+</dt>
    <dd><strong>Edmund McMillen <span data-i18n="about.and"></span> Nicalis</strong>. <span data-i18n="about.game"></span></dd>
  </dl>
  <p class="note" data-i18n="about.fans"></p>
  <h3 data-i18n="about.support"></h3>
  <p id="supportText"></p>
  <form method="dialog"><button class="primary" data-i18n="about.close"></button></form>
</dialog>
<script src="i18n.js"></script>
<script src="panel.js"></script>
</body>
</html>
