<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MultiTracker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <h1><a class="back" href="/" data-i18n-title="panel.back" data-i18n-aria="panel.back">←</a>MultiTracker</h1>
  <div class="actions">
    <label class="lang"><span data-i18n="panel.language"></span> <select id="language"></select></label>
    <a id="supportLink" class="button support" target="_blank" rel="noopener"><span aria-hidden="true">♥</span> <span data-i18n="about.support"></span></a>
    <button id="about" data-i18n="panel.about"></button>
    <button id="copyLink" data-i18n="panel.copyLink"></button>
    <button id="openWindow" class="primary" data-i18n="panel.openWindow"></button>
  </div>
</header>
<div id="updateBar" class="update-bar" hidden>
  <span id="updateText"></span>
  <button type="button" id="updateButton" class="primary"></button>
  <button type="button" id="updateLater" data-i18n="update.later"></button>
</div>
<main>
  <form id="form">
    <section>
      <h2 data-i18n="save.title"></h2>
      <select id="saveId" data-i18n-aria="save.aria"></select>
      <div id="customSave" class="path-row" hidden>
        <input id="saveFile" data-i18n-aria="save.pathAria" data-i18n-placeholder="save.pathPlaceholder" spellcheck="false">
        <button type="button" id="browseSave" data-i18n="save.browse"></button>
      </div>
      <p class="note" id="saveStatus"></p>
      <p class="note" data-i18n="save.playtimeNote"></p>
    </section>
    <section data-reset>
      <h2 data-i18n="run.title"></h2>
      <div id="showRun" class="checks"></div>
      <p class="note" id="logStatus"></p>
    </section>
    <section data-reset>
      <h2 data-i18n="progress.title"></h2>
      <div id="showProgress" class="checks"></div>
      <div class="fields spaced">
        <label><span data-i18n="progress.style"></span>
          <select data-option="progressStyle"><option value="icons" data-i18n="progress.icons"></option><option value="text" data-i18n="progress.text"></option><option value="both" data-i18n="progress.both"></option></select>
        </label>
        <label><span data-i18n="progress.swapSeconds"></span> <span class="slider"><input type="range" data-option="progressSwapSeconds" min="3" max="60"><output></output></span></label>
        <label><span data-i18n="progress.fadeMs"></span> <span class="slider"><input type="range" data-option="progressFadeMs" min="100" max="3000" step="50"><output></output></span></label>
        <label><span data-i18n="progress.pending"></span>
          <select data-option="pendingLook"><option value="color" data-i18n="progress.pendingColor"></option><option value="gray" data-i18n="progress.pendingGray"></option></select>
        </label>
      </div>
      <p class="note" data-i18n="progress.iconsNote"></p>
    </section>
    <section data-reset class="pick-list">
      <h2 data-i18n="goals.title"></h2>
      <div class="list-tools"><input type="search" class="list-search" data-i18n-placeholder="list.search" data-i18n-aria="list.search" spellcheck="false"><span class="list-count muted"></span></div>
      <div id="goals" class="checks"></div>
      <p class="note list-empty" data-i18n="list.noMatch" hidden></p>
    </section>
    <section data-reset class="pick-list">
      <h2 data-i18n="watched.title"></h2>
      <div class="list-tools"><input type="search" class="list-search" data-i18n-placeholder="list.search" data-i18n-aria="list.search" spellcheck="false"><span class="list-count muted"></span></div>
      <div id="watched" class="checks"></div>
      <p class="note list-empty" data-i18n="list.noMatch" hidden></p>
    </section>
    <section data-reset>
      <h2 data-i18n="items.title"></h2>
      <div class="fields">
        <label><span data-i18n="items.max"></span> <input type="number" data-option="maxItems" min="0" max="200"></label>
        <label><span data-i18n="items.removed"></span>
          <select data-option="removed"><option value="dim" data-i18n="items.dim"></option><option value="hide" data-i18n="items.hide"></option></select>
        </label>
        <label><span data-i18n="items.mark"></span>
          <select data-option="markItem"><option value="none" data-i18n="items.markNone"></option><option value="latest" data-i18n="items.markLatest"></option><option value="hover" data-i18n="items.markHover"></option></select>
        </label>
      </div>
      <div class="checks">
        <label><input type="checkbox" data-option="hoverDesc"> <span data-i18n="items.hoverDesc"></span></label>
        <label><input type="checkbox" data-option="hideDone"> <span data-i18n="items.hideDone"></span></label>
        <label><input type="checkbox" data-option="floorGroups"> <span data-i18n="items.floorGroups"></span></label>
        <label><input type="checkbox" data-option="transformsClose"> <span data-i18n="items.transformsClose"></span></label>
      </div>
    </section>
    <section data-reset>
      <h2 data-i18n="highlight.title"></h2>
      <div class="checks"><label><input type="checkbox" data-option="highlight"> <span data-i18n="highlight.on"></span></label></div>
      <div class="fields">
        <label><span data-i18n="highlight.style"></span>
          <select data-option="highlightStyle">
            <option value="full" data-i18n="highlight.full"></option><option value="toast" data-i18n="highlight.toast"></option>
            <option value="fly" data-i18n="highlight.fly"></option><option value="spotlight" data-i18n="highlight.spotlight"></option>
            <option value="ticker" data-i18n="highlight.ticker"></option><option value="pulse" data-i18n="highlight.pulse"></option>
          </select>
        </label>
        <label><span data-i18n="highlight.seconds"></span> <span class="slider"><input type="range" data-option="highlightSeconds" min="2" max="20"><output></output></span></label>
      </div>
      <p class="note" id="highlightNote"></p>
      <button type="button" id="testHighlight" data-i18n="highlight.test"></button>
    </section>
    <section>
      <h2 data-i18n="look.title"></h2>
      <div class="fields">
        <label><span data-i18n="look.theme"></span>
          <select id="theme" data-i18n-aria="look.themeAria"></select>
        </label>
      </div>
      <div class="row-actions"><button type="button" id="themeSave" data-i18n="theme.save"></button></div>
      <div class="name-row" id="themeNameRow" hidden>
        <input id="themeName" maxlength="40" spellcheck="false" data-i18n-placeholder="theme.namePlaceholder" data-i18n-aria="theme.namePlaceholder">
        <button type="button" class="primary name-ok" data-i18n="name.ok"></button><button type="button" class="name-cancel" data-i18n="name.cancel"></button>
      </div>
      <div id="myThemes" class="my-themes"></div>
      <p class="note error" id="themeError"></p>
      <div class="group" data-reset>
      <h3 data-i18n="look.text"></h3>
      <div class="fields">
        <label><span data-i18n="look.font"></span>
          <select data-option="font" id="fonts">
            <option value="Upheaval">Upheaval</option><option value="Segoe UI">Segoe UI</option><option value="Arial">Arial</option><option value="Bahnschrift">Bahnschrift</option><option value="Consolas">Consolas</option><option value="Georgia">Georgia</option><option value="Impact">Impact</option><option value="Trebuchet MS">Trebuchet MS</option><option value="Verdana">Verdana</option><option value="Comic Sans MS">Comic Sans MS</option>
          </select>
        </label>
        <label><span data-i18n="look.fontSize"></span> <span class="slider"><input type="range" data-option="fontSize" min="10" max="32"><output></output></span></label>
        <label><span data-i18n="look.textEffect"></span>
          <select data-option="textEffect"><option value="none" data-i18n="look.none"></option><option value="shadow" data-i18n="look.shadow"></option><option value="outline" data-i18n="look.outline"></option></select>
        </label>
        <label><span data-i18n="look.whoOutline"></span>
          <select data-option="whoOutline"><option value="none" data-i18n="look.none"></option><option value="outline" data-i18n="look.outline"></option><option value="glow" data-i18n="look.glow"></option></select>
        </label>
        <label><span data-i18n="look.whoOutlineColor"></span> <input type="color" data-option="whoOutlineColor"></label>
        <label><span data-i18n="look.whoOutlineSize"></span> <span class="slider"><input type="range" data-option="whoOutlineSize" min="1" max="4"><output></output></span></label>
        <label><span data-i18n="look.textColor"></span> <input type="color" data-option="textColor"></label>
        <label><span data-i18n="look.accentColor"></span> <input type="color" data-option="accentColor"></label>
        <label><span data-i18n="look.doneColor"></span> <input type="color" data-option="doneColor"></label>
      </div>
      <div class="checks"><label><input type="checkbox" data-option="bold"> <span data-i18n="look.bold"></span></label></div>
      </div>
      <div class="group" data-reset>
      <h3 data-i18n="look.icons"></h3>
      <div class="fields">
        <label><span data-i18n="look.iconAuto"></span> <input type="checkbox" data-option="iconAuto"></label>
        <label><span data-i18n="look.iconSize"></span> <span class="slider"><input type="range" data-option="iconSize" min="16" max="96" step="4"><output></output></span></label>
        <label><span data-i18n="look.rows"></span> <span class="slider"><input type="range" data-option="rows" min="0" max="8"><output></output></span></label>
        <label><span data-i18n="look.overflow"></span>
          <select data-option="overflow"><option value="pages" data-i18n="look.overflowPages"></option><option value="marquee" data-i18n="look.overflowMarquee"></option><option value="shrink" data-i18n="look.overflowShrink"></option></select>
        </label>
        <label><span data-i18n="look.pageMinIcon"></span> <span class="slider"><input type="range" data-option="pageMinIcon" min="16" max="96" step="4"><output></output></span></label>
        <label><span data-i18n="look.pageSeconds"></span> <span class="slider"><input type="range" data-option="pageSeconds" min="3" max="20"><output></output></span></label>
        <label><span data-i18n="look.pageEffect"></span>
          <select data-option="pageEffect"><option value="slide" data-i18n="look.pageSlide"></option><option value="fade" data-i18n="look.pageFade"></option><option value="none" data-i18n="look.none"></option></select>
        </label>
        <label><span data-i18n="look.pageDirection"></span>
          <select data-option="pageDirection"><option value="ltr" data-i18n="look.pageLtr"></option><option value="rtl" data-i18n="look.pageRtl"></option></select>
        </label>
        <label><span data-i18n="look.marqueeSpeed"></span> <span class="slider"><input type="range" data-option="marqueeSpeed" min="10" max="300" step="5"><output></output></span></label>
        <label><span data-i18n="look.pageAnimMs"></span> <span class="slider"><input type="range" data-option="pageAnimMs" min="100" max="2000" step="50"><output></output></span></label>
        <label><span data-i18n="look.pageDots"></span> <input type="checkbox" data-option="pageDots"></label>
        <label><span data-i18n="look.iconGap"></span> <span class="slider"><input type="range" data-option="iconGap" min="0" max="16"><output></output></span></label>
        <label><span data-i18n="look.blindMark"></span>
          <select data-option="blindMark"><option value="floor" data-i18n="look.blindFloor"></option><option value="items" data-i18n="look.blindItems"></option><option value="none" data-i18n="look.blindNone"></option></select>
        </label>
        <label><span data-i18n="look.blindColor"></span> <input type="color" data-option="blindColor"></label>
        <label><span data-i18n="look.iconEffect"></span>
          <select data-option="iconEffect"><option value="none" data-i18n="look.none"></option><option value="glow" data-i18n="look.glow"></option><option value="shadow" data-i18n="look.shadow"></option></select>
        </label>
      </div>
      <div class="fields spaced">
        <label><span data-i18n="look.ownerBadgeSize"></span>
          <select data-option="ownerBadgeSize"><option value="small" data-i18n="look.badgeSmall"></option><option value="medium" data-i18n="look.badgeMedium"></option><option value="large" data-i18n="look.badgeLarge"></option></select>
        </label>
        <label><span data-i18n="look.ownerBadgeCorner"></span>
          <select data-option="ownerBadgeCorner"><option value="bl" data-i18n="look.cornerBl"></option><option value="br" data-i18n="look.cornerBr"></option><option value="tl" data-i18n="look.cornerTl"></option><option value="tr" data-i18n="look.cornerTr"></option></select>
        </label>
      </div>
      <div class="checks single"><label><input type="checkbox" data-option="ownerBadgeBg"> <span data-i18n="look.ownerBadgeBg"></span></label></div>
      <p class="note error" id="iconNote"></p>
      </div>
      <div class="group" data-reset>
      <h3 data-i18n="look.layout"></h3>
      <div class="fields">
        <label><span data-i18n="look.mode"></span>
          <select data-option="layout"><option value="banner" data-i18n="look.banner"></option><option value="wide" data-i18n="look.wide"></option></select>
        </label>
        <label><span data-i18n="look.viewWidth"></span> <input type="number" data-option="viewWidth" min="200" max="3840" step="1"></label>
        <label><span data-i18n="look.viewHeight"></span> <input type="number" data-option="viewHeight" min="60" max="2160" step="1"></label>
        <label><span data-i18n="look.align"></span>
          <select data-option="align"><option value="left" data-i18n="look.left"></option><option value="center" data-i18n="look.center"></option><option value="right" data-i18n="look.right"></option></select>
        </label>
        <label><span data-i18n="look.itemsPlace"></span>
          <select data-option="itemsPosition"><option value="below" data-i18n="look.itemsBelow"></option><option value="above" data-i18n="look.itemsAbove"></option></select>
        </label>
        <label><span data-i18n="look.rowGap"></span> <span class="slider"><input type="range" data-option="rowGap" min="0" max="24"><output></output></span></label>
        <label><span data-i18n="look.padding"></span> <span class="slider"><input type="range" data-option="padding" min="0" max="32"><output></output></span></label>
        <label><span data-i18n="look.sideAuto"></span> <input type="checkbox" data-option="sideAuto"></label>
        <label><span data-i18n="look.sideWidth"></span> <span class="slider"><input type="range" data-option="sideWidth" min="120" max="400" step="10"><output></output></span></label>
      </div>
      <p class="note" data-i18n="look.sizeNote"></p>
      </div>
      <div class="group" data-reset>
      <h3 data-i18n="look.background"></h3>
      <div class="fields">
        <label><span data-i18n="look.bgType"></span>
          <select data-option="background"><option value="transparent" data-i18n="look.transparent"></option><option value="solid" data-i18n="look.solid"></option><option value="brick" data-i18n="look.brick"></option></select>
        </label>
        <label><span data-i18n="look.color"></span> <input type="color" data-option="color"></label>
        <label><span data-i18n="look.opacity"></span> <span class="slider"><input type="range" data-option="backgroundOpacity" min="0" max="100" step="5"><output></output></span></label>
        <label><span data-i18n="look.radius"></span> <span class="slider"><input type="range" data-option="radius" min="0" max="24"><output></output></span></label>
        <div class="bg-image-row"><span data-i18n="look.bgImage"></span>
          <span class="bg-image-actions"><span id="bgImageStatus" class="muted"></span>
            <button type="button" id="bgImageChoose" data-i18n="look.bgImageChoose"></button>
            <button type="button" id="bgImageRemove" data-i18n="look.bgImageRemove" hidden></button>
            <input type="file" id="bgImageFile" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
          </span>
        </div>
      </div>
      <div class="fields bg-image-only">
        <label><span data-i18n="look.bgImageOpacity"></span> <span class="slider"><input type="range" data-option="bgImageOpacity" min="0" max="100" step="5"><output></output></span></label>
        <label><span data-i18n="look.bgImageFit"></span>
          <select data-option="bgImageFit"><option value="cover" data-i18n="look.fitCover"></option><option value="contain" data-i18n="look.fitContain"></option><option value="stretch" data-i18n="look.fitStretch"></option><option value="tile" data-i18n="look.fitTile"></option><option value="scale" data-i18n="look.fitScale"></option></select>
        </label>
        <label><span data-i18n="look.bgImageScale"></span> <span class="slider"><input type="range" data-option="bgImageScale" min="10" max="400" step="5"><output></output></span></label>
        <label><span data-i18n="look.bgImageX"></span> <span class="slider"><input type="range" data-option="bgImageX" min="-100" max="200"><output></output></span></label>
        <label><span data-i18n="look.bgImageY"></span> <span class="slider"><input type="range" data-option="bgImageY" min="-100" max="200"><output></output></span></label>
      </div>
      <p class="note error" id="bgImageError"></p>
      <p class="note" data-i18n="look.bgImageNote"></p>
      </div>
    </section>
    <section id="profiles">
      <h2 data-i18n="profile.title"></h2>
      <div class="fields">
        <label><span data-i18n="profile.editing"></span> <select id="profileSelect"></select></label>
      </div>
      <div class="row-actions">
        <button type="button" id="profileNew" data-i18n="profile.new"></button>
        <button type="button" id="profileRename" data-i18n="profile.rename"></button>
        <button type="button" id="profileDelete" data-i18n="profile.delete"></button>
      </div>
      <div class="name-row" id="profileNameRow" hidden>
        <input id="profileName" maxlength="40" spellcheck="false" data-i18n-placeholder="profile.namePlaceholder" data-i18n-aria="profile.namePlaceholder">
        <button type="button" class="primary name-ok" data-i18n="name.ok"></button><button type="button" class="name-cancel" data-i18n="name.cancel"></button>
      </div>
      <div class="fields spaced">
        <label><span data-i18n="profile.window"></span> <select id="windowProfile"></select></label>
      </div>
      <p class="note error" id="profileError"></p>
      <p class="note" data-i18n="profile.note"></p>
      <h3 data-i18n="transfer.title"></h3>
      <div class="row-actions">
        <button type="button" id="exportLook" data-i18n="transfer.exportLook"></button>
        <button type="button" id="exportAll" data-i18n="transfer.exportAll"></button>
        <button type="button" id="importButton" data-i18n="transfer.import"></button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
      <p class="note error" id="transferError"></p>
      <p class="note" data-i18n="transfer.note"></p>
    </section>
    <section id="aboutBox" class="about-box">
      <h2 data-i18n="about.title"></h2>
      <p data-i18n="about.lead"></p>
      <p class="about-author"><strong>Mafla</strong> · <span data-i18n="about.creator"></span></p>
      <p class="note" id="appVersion"></p>
      <p class="update-check" id="updateCheck" hidden><button type="button" id="checkUpdates" data-i18n="update.check"></button> <span class="note" id="updateNote"></span></p>
      <p class="note" id="updatePortable" data-i18n="update.portable" hidden></p>
      <h3 data-i18n="about.social"></h3>
      <div class="social-links" id="socialLinks"></div>
      <h3><span aria-hidden="true" class="heart">♥</span> <span data-i18n="about.support"></span></h3>
      <p id="supportPanelText"></p>
      <a id="supportButton" class="button support" target="_blank" rel="noopener" data-i18n="support.button"></a>
      <details class="about-credits">
        <summary data-i18n="about.credits"></summary>
      <dl>
        <dt><a href="https://github.com/maflatv/Isaac-MultiTracker" target="_blank" rel="noopener">MultiTracker</a></dt>
        <dd><strong>Mafla</strong>. <span data-i18n="about.creator"></span></dd>
        <dt><a href="https://github.com/Hyphen-ated/RebirthItemTracker" target="_blank" rel="noopener">Rebirth Item Tracker</a></dt>
        <dd><strong>Brett824 <span data-i18n="about.and"></span> Hyphen-ated</strong>. <span data-i18n="about.rit"></span></dd>
        <dt>Isaac Deadgod Tracker</dt>
        <dd><strong>veryhighlibido</strong>. <span data-i18n="about.deadgod"></span></dd>
        <dt><a href="https://www.dafont.com/aenigma.d188" target="_blank" rel="noopener" data-i18n="about.font"></a></dt>
        <dd><strong>Brian Kent (Ænigma Fonts)</strong>. <span data-i18n="about.fontNote"></span></dd>
        <dt><a href="https://www.electronjs.org" target="_blank" rel="noopener">Electron</a> (Chromium, Node.js)</dt>
        <dd><strong>OpenJS Foundation <span data-i18n="about.and"></span> <span data-i18n="about.contributors"></span></strong>. <span data-i18n="about.electron"></span></dd>
        <dt>The Binding of Isaac: Repentance+</dt>
        <dd><strong>Edmund McMillen <span data-i18n="about.and"></span> Nicalis</strong>. <span data-i18n="about.game"></span></dd>
      </dl>
        <p class="note" data-i18n="about.fans"></p>
      </details>
    </section>
  </form>
  <section id="previewPane">
    <h2 data-i18n="preview.title"></h2>
    <iframe id="preview" src="overlay.html" data-i18n-title="preview.frame"></iframe>
    <div id="obsOption" class="checks single" hidden>
      <label><input type="checkbox" id="obsServer"> <span data-i18n="obs.server"></span></label>
    </div>
    <p class="note" id="obsNote" hidden data-i18n="obs.serverNote"></p>
    <p class="note" id="linkRow"><span data-i18n="preview.obsLink"></span> <code id="link"></code></p>
    <div class="fields obs-profile" id="obsProfileRow"><label><span data-i18n="profile.obs"></span> <select id="obsProfile"></select></label></div>
  </section>
</main>
<div id="toast" role="status" hidden><span id="toastText"></span><button type="button" id="toastUndo" data-i18n="panel.undo"></button><button type="button" id="toastClose" class="link" data-i18n-aria="panel.close" data-i18n-title="panel.close">×</button></div>
<script src="i18n.js"></script>
<script src="panel.js"></script>
</body>
</html>
